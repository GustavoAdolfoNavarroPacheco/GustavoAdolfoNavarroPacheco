<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" role="img" aria-label="Stack técnico: lenguajes, backend, frontend, bases de datos, IA, arquitectura, herramientas y despliegue"><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t64{font-size:64px;letter-spacing:-1px}.t32{font-size:32px;letter-spacing:-.3px}.t20{font-size:20px}.t16{font-size:16px}.t14{font-size:14px}.b{font-weight:600}.i{font-style:italic}.ink{fill:#141413}.tx{fill:#2b2a27}.mu{fill:#5e5d59}.so{fill:#87867f}.ac{fill:#d97757}.at{fill:#b9532f}.ul{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#a3a095}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}.pop{animation:pop .7s cubic-bezier(.2,.7,.2,1) backwards}.fade{animation:fade .9s ease backwards}.draw{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.6,0,.2,1) backwards}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes grow{from{transform:scaleX(0)}}.pulse{animation:pulse 2.8s ease-in-out infinite}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}.glint{stroke-dasharray:60 1000;animation:glint 8s ease-in-out infinite}.march{stroke-dasharray:3 7;animation:march 1.8s linear infinite}.travel{animation:travel 7s linear infinite}.nudge{animation:nudge 3.2s ease-in-out infinite}.scan{animation:scan 9s steps(1,end) infinite}.slide{animation:slide 9s linear infinite}.trace{animation:trace 10s linear infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.8);opacity:0}}@keyframes glint{0%{stroke-dashoffset:60}65%,100%{stroke-dashoffset:-1000}}@keyframes march{to{stroke-dashoffset:-10}}@keyframes travel{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}@keyframes nudge{0%,55%,100%{transform:translate(0,0)}70%{transform:translate(2px,-2px)}85%{transform:translate(0,0)}}@keyframes scan{0%{opacity:1}11.1%,100%{opacity:0}}@keyframes slide{0%{transform:translateX(0);opacity:0}6%{opacity:1}72%{opacity:1}80%,100%{transform:translateX(var(--d));opacity:0}}@keyframes trace{0%{offset-distance:0%;opacity:0}5%{opacity:1}68%{offset-distance:100%;opacity:1}75%,100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion:reduce){.rise,.pop,.fade,.draw,.grow,.pulse,.ping,.glint,.march,.travel,.nudge,.scan,.slide,.trace{animation:none}.glint,.ping,.travel,.scan,.slide,.trace{opacity:0}}</style><rect width="1000" height="386" fill="#faf9f5"/><text x="48" y="34" class="sans t14 mu rise">Lenguajes</text><text x="200" y="34" class="sans t16 ink rise" style="animation-delay:0.05s">TypeScript · Java · JavaScript · Python · HTML · CSS</text><line class="draw" pathLength="1" x1="48" y1="52.5" x2="952" y2="52.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.1s"/><rect class="scan" x="34" y="21" width="2" height="18" fill="#d97757" style="animation-duration:10.799999999999999s;animation-delay:0.0s;opacity:0"/><text x="48" y="74" class="sans t14 mu rise" style="animation-delay:0.06s">Backend</text><text x="200" y="74" class="sans t16 ink rise" style="animation-delay:0.11s">SpringBoot · Node.js · Express · Serverless · Cloud Functions</text><line class="draw" pathLength="1" x1="48" y1="92.5" x2="952" y2="92.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.16s"/><rect class="scan" x="34" y="61" width="2" height="18" fill="#d97757" style="animation-duration:10.799999999999999s;animation-delay:1.2s;opacity:0"/><text x="48" y="114" class="sans t14 mu rise" style="animation-delay:0.12s">Frontend</text><text x="200" y="114" class="sans t16 ink rise" style="animation-delay:0.16999999999999998s">React · Next.js · Vite · Tailwind · shadcn/ui</text><line class="draw" pathLength="1" x1="48" y1="132.5" x2="952" y2="132.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.22s"/><rect class="scan" x="34" y="101" width="2" height="18" fill="#d97757" style="animation-duration:10.799999999999999s;animation-delay:2.4s;opacity:0"/><text x="48" y="154" class="sans t14 mu rise" style="animation-delay:0.18s">Bases de datos</text><text x="200" y="154" class="sans t16 ink rise" style="animation-delay:0.22999999999999998s">MySQL · PostgreSQL (Neon) · Firestore · Prisma</text><line class="draw" pathLength="1" x1="48" y1="172.5" x2="952" y2="172.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.28s"/><rect class="scan" x="34" y="141" width="2" height="18" fill="#d97757" style="animation-duration:10.799999999999999s;animation-delay:3.5999999999999996s;opacity:0"/><text x="48" y="194" class="sans t14 mu rise" style="animation-delay:0.24s">IA</text><text x="200" y="194" class="sans t16 ink rise" style="animation-delay:0.29s">Gemini · DeepSeek · Vercel AI SDK · Claude Code · WhatsApp API</text><line class="draw" pathLength="1" x1="48" y1="212.5" x2="952" y2="212.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.33999999999999997s"/><rect class="scan" x="34" y="181" width="2" height="18" fill="#d97757" style="animation-duration:10.799999999999999s;animation-delay:4.8s;opacity:0"/><text x="48" y="234" class="sans t14 mu rise" style="animation-delay:0.3s">Arquitectura</text><text x="200" y="234" class="sans t16 ink rise" style="animation-delay:0.35s">Monolith · REST APIs · MVC · Microservices</text><line class="draw" pathLength="1" x1="48" y1="252.5" x2="952" y2="252.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.55" style="animation-delay:0.4s"/><rect class="scan" x="34" y="22