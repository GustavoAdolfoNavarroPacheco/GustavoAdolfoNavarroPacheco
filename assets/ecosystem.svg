<svg viewBox="0 0 1000 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="System map: business systems, AI and automation, web and data projects, all from one pipeline">
  <style>
    :root {
      --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0;
      --node-bg: #F0F0F0; --core-bg: #E8E8E8; --accent: #555555;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444;
        --node-bg: #1A1A1A; --core-bg: #222222; --accent: #AAAAAA;
      }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .node { fill: none; stroke: var(--rule); stroke-width: 1; }
    .nodeC { fill: none; stroke: var(--rule); stroke-width: 1; }
    .wire { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 500; stroke-dashoffset: 500; animation: draw 1.6s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .w1{animation-delay:.2s}.w2{animation-delay:.32s}.w3{animation-delay:.44s}.w4{animation-delay:.56s}.w5{animation-delay:.68s}.w6{animation-delay:.8s}.w7{animation-delay:.92s}.w8{animation-delay:1.04s}.w9{animation-delay:1.16s}
    .flow { stroke: var(--muted); stroke-width: 1; opacity: .2; stroke-dasharray: 3 9; animation: march 1.4s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -12; } }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .p0{animation-delay:.1s}.p1{animation-delay:0.9s}.p2{animation-delay:1.0s}.p3{animation-delay:1.1s}.p4{animation-delay:1.2s}.p5{animation-delay:1.3s}.p6{animation-delay:1.4s}.p7{animation-delay:1.5s}.p8{animation-delay:1.6s}.p9{animation-delay:1.7s}.p10{animation-delay:1.8s}.p11{animation-delay:1.9s}.p12{animation-delay:2.0s}.p13{animation-delay:2.1s}.p14{animation-delay:2.2s}
    .core { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.55} }
    @media (prefers-reduced-motion: reduce) {
      .wire,.flow,.pop,.core { animation: none; }
      .wire{stroke-dashoffset:0} .pop{opacity:1} .flow{opacity:.1}
    }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <defs>
    <mask id="node-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="640">
      <rect x="0" y="0" width="1000" height="640" fill="white"/>
      <rect x="405" y="50" width="190" height="56" fill="black"/>
      <rect x="75" y="200" width="200" height="54" fill="black"/>
      <rect x="75" y="278" width="200" height="54" fill="black"/>
      <rect x="75" y="356" width="200" height="54" fill="black"/>
      <rect x="75" y="434" width="200" height="54" fill="black"/>
      <rect x="75" y="512" width="200" height="54" fill="black"/>
      <rect x="400" y="200" width="200" height="54" fill="black"/>
      <rect x="400" y="278" width="200" height="54" fill="black"/>
      <rect x="400" y="356" width="200" height="54" fill="black"/>
      <rect x="400" y="434" width="200" height="54" fill="black"/>
      <rect x="400" y="512" width="200" height="54" fill="black"/>
      <rect x="725" y="200" width="200" height="54" fill="black"/>
      <rect x="725" y="278" width="200" height="54" fill="black"/>
      <rect x="725" y="356" width="200" height="54" fill="black"/>
      <rect x="725" y="434" width="200" height="54" fill="black"/>
    </mask>
  </defs>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">SYSTEM MAP — EVERYTHING FROM ONE PIPELINE</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>

  <!-- wires -->
  <g mask="url(#node-cutouts)">
    <line class="wire w1" x1="500" y1="106" x2="175" y2="150"/>
    <line class="wire w2" x1="500" y1="106" x2="500" y2="150"/>
    <line class="wire w3" x1="500" y1="106" x2="825" y2="150"/>
  </g>
  <!-- column spines (data in motion) -->
  <g mask="url(#node-cutouts)">
    <line class="flow" x1="175" y1="182" x2="175" y2="539"/>
    <line class="flow" x1="500" y1="182" x2="500" y2="539"/>
    <line class="flow" x1="825" y1="182" x2="825" y2="461"/>
  </g>

  <!-- cluster labels -->
  <text fill="var(--accent)" class="mono pop p10" x="175" y="170" font-size="10" letter-spacing="3" text-anchor="middle">BUSINESS SYSTEMS</text>
  <text fill="var(--accent)" class="mono pop p10" x="500" y="170" font-size="10" letter-spacing="3" text-anchor="middle">AI &amp; AUTOMATION</text>
  <text fill="var(--accent)" class="mono pop p10" x="825" y="170" font-size="10" letter-spacing="3" text-anchor="middle">WEB &amp; DATA</text>

  <!-- core -->
  <g class="pop p0">
    <rect class="nodeC" x="405" y="50" width="190" height="56" rx="2"/>
    <text fill="var(--bone)" class="mono" x="500" y="74" font-size="13" letter-spacing="2" text-anchor="middle">GUSTAVO NAVARRO</text>
    <text fill="var(--muted)" class="mono" x="500" y="92" font-size="8.5" letter-spacing="0.5" text-anchor="middle">one-person build pipeline</text>
  </g>

  <!-- nodes -->
  <g class="pop p1"><rect class="node" x="75" y="200" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="223" font-size="12" letter-spacing="1" text-anchor="middle">CRM Campuslands</text><text fill="var(--muted)" class="mono" x="175" y="242" font-size="9" letter-spacing="1" text-anchor="middle">Internal Company CRM</text></g>
  <g class="pop p2"><rect class="node" x="75" y="278" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="301" font-size="12" letter-spacing="1" text-anchor="middle">Casablanca Hub</text><text fill="var(--muted)" class="mono" x="175" y="320" font-size="9" letter-spacing="1" text-anchor="middle">Recruitment · AI + WhatsApp</text></g>
  <g class="pop p3"><rect class="node" x="75" y="356" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="379" font-size="12" letter-spacing="1" text-anchor="middle">TecnoStore</text><text fill="var(--muted)" class="mono" x="175" y="398" font-size="9" letter-spacing="1" text-anchor="middle">Enterprise Management</text></g>
  <g class="pop p4"><rect class="node" x="75" y="434" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="457" font-size="12" letter-spacing="1" text-anchor="middle">Logitrack</text><text fill="var(--muted)" class="mono" x="175" y="476" font-size="9" letter-spacing="1" text-anchor="middle">Warehouse Management</text></g>
  <g class="pop p5"><rect class="node" x="75" y="512" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="175" y="535" font-size="12" letter-spacing="1" text-anchor="middle">Topping</text><text fill="var(--muted)" class="mono" x="175" y="554" font-size="9" letter-spacing="1" text-anchor="middle">Pizzeria Management</text></g>
  <g class="pop p6"><rect class="node" x="400" y="200" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="223" font-size="12" letter-spacing="1" text-anchor="middle">Waylo.ai</text><text fill="var(--muted)" class="mono" x="500" y="242" font-size="9" letter-spacing="1" text-anchor="middle">Patient Triage Navigator</text></g>
  <g class="pop p7"><rect class="node" x="400" y="278" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="301" font-size="12" letter-spacing="1" text-anchor="middle">Conect.ia</text><text fill="var(--muted)" class="mono" x="500" y="320" font-size="9" letter-spacing="1" text-anchor="middle">Social Media Automation</text></g>
  <g class="pop p8"><rect class="node" x="400" y="356" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="379" font-size="12" letter-spacing="1" text-anchor="middle">FullService Agents</text><text fill="var(--muted)" class="mono" x="500" y="398" font-size="9" letter-spacing="1" text-anchor="middle">Sales Agents Pipeline</text></g>
  <g class="pop p9"><rect class="node" x="400" y="434" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="457" font-size="12" letter-spacing="1" text-anchor="middle">ViraAI</text><text fill="var(--muted)" class="mono" x="500" y="476" font-size="9" letter-spacing="1" text-anchor="middle">Marketing Multi-Agent</text></g>
  <g class="pop p10"><rect class="node" x="400" y="512" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="500" y="535" font-size="12" letter-spacing="1" text-anchor="middle">Sora</text><text fill="var(--muted)" class="mono" x="500" y="554" font-size="9" letter-spacing="1" text-anchor="middle">Smart Recruitment</text></g>
  <g class="pop p11"><rect class="node" x="725" y="200" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="825" y="223" font-size="12" letter-spacing="1" text-anchor="middle">LMS Portal</text><text fill="var(--muted)" class="mono" x="825" y="242" font-size="9" letter-spacing="1" text-anchor="middle">LMS Web Platform</text></g>
  <g class="pop p12"><rect class="node" x="725" y="278" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="825" y="301" font-size="12" letter-spacing="1" text-anchor="middle">KarioMedia</text><text fill="var(--muted)" class="mono" x="825" y="320" font-size="9" letter-spacing="1" text-anchor="middle">Metrics Dashboard</text></g>
  <g class="pop p13"><rect class="node" x="725" y="356" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="825" y="379" font-size="12" letter-spacing="1" text-anchor="middle">Portfolio</text><text fill="var(--muted)" class="mono" x="825" y="398" font-size="9" letter-spacing="1" text-anchor="middle">Personal Site</text></g>
  <g class="pop p14"><rect class="node" x="725" y="434" width="200" height="54" rx="2"/><text fill="var(--bone)" class="mono" x="825" y="457" font-size="12" letter-spacing="1" text-anchor="middle">Spendify</text><text fill="var(--muted)" class="mono" x="825" y="476" font-size="9" letter-spacing="1" text-anchor="middle">Expense Simulator</text></g>

  <line x1="48" y1="606" x2="952" y2="606" stroke="var(--rule)"/>
  <text fill="var(--dim)" class="mono" x="952" y="628" font-size="10" letter-spacing="2" text-anchor="end">DASHED LINES — DATA IN MOTION</text>
</svg>
