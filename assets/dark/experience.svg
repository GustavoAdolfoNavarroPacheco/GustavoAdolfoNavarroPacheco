<svg viewBox="0 0 1000 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #FFFFFF; --muted: #FFFFFF; --dim: #FFFFFF; --rule: #FFFFFF; --accent: #FFFFFF; --node-bg: #000000; --core-bg: #000000; --ghost: #FFFFFF; }
  </style>

  <line x1="120" y1="10" x2="120" y2="170" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">1yr 4mo</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">Campuslands · Software Developer · Internship</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="118" font-size="12" fill="var(--accent)" letter-spacing="2">1yr 1mo</text>
    <text class="mono" x="136" y="118" font-size="15" fill="var(--bone)">Solvo · Software Developer · Internship</text>
  </g>
</svg>