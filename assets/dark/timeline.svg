<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline">
  <style>
    :root { --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .axis { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 1110; stroke-dashoffset: 1110; animation: draw 2.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .m { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .m1{animation-delay:.4s}.m2{animation-delay:.7s}.m3{animation-delay:1.0s}.m4{animation-delay:1.3s}.m5{animation-delay:1.6s}.m6{animation-delay:1.9s}.m7{animation-delay:2.2s}
    .pulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .ring { animation: ring 2.6s ease-out infinite; transform-origin: 950px 125px; }
    @keyframes ring { 0%{transform:scale(.4);opacity:.8} 80%,100%{transform:scale(3);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .axis,.m,.pulse,.ring { animation: none; } .axis{stroke-dashoffset:0} .m{opacity:1} .ring{opacity:0}
    }
      :root { --bone: #FFFFFF; --muted: #FFFFFF; --dim: #FFFFFF; --rule: #FFFFFF; --accent: #FFFFFF; --node-bg: #000000; --core-bg: #000000; --ghost: #FFFFFF; }
  </style>

  <line x1="48" y1="40" x2="1152" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text fill="var(--muted)" class="mono" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>

  <line class="axis" x1="48" y1="125" x2="1158" y2="125"/>

  <g class="m m1">
    <circle cx="100" cy="125" r="4" fill="var(--bone)"/>
    <line x1="100" y1="121" x2="100" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="100" y="74" font-size="11" letter-spacing="2" text-anchor="middle">APR 2025</text>
    <text fill="var(--bone)" class="mono" x="100" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Started coding</text>
  </g>

  <g class="m m2">
    <circle cx="270" cy="125" r="4" fill="var(--bone)"/>
    <line x1="270" y1="129" x2="270" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="270" y="172" font-size="11" letter-spacing="2" text-anchor="middle">JUL 2025</text>
    <text fill="var(--bone)" class="mono" x="270" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Solvo Internship</text>
  </g>

  <g class="m m3">
    <circle cx="440" cy="125" r="4" fill="var(--bone)"/>
    <line x1="440" y1="121" x2="440" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="440" y="74" font-size="11" letter-spacing="2" text-anchor="middle">FEB 2026</text>
    <text fill="var(--bone)" class="mono" x="440" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">LogiTrack</text>
  </g>

  <g class="m m4">
    <circle cx="610" cy="125" r="4" fill="var(--bone)"/>
    <line x1="610" y1="129" x2="610" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="610" y="172" font-size="11" letter-spacing="2" text-anchor="middle">APR 2026</text>
    <text fill="var(--bone)" class="mono" x="610" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Finished Campuslands Course</text>
  </g>

  <g class="m m5">
    <circle cx="780" cy="125" r="4" fill="var(--bone)"/>
    <line x1="780" y1="121" x2="780" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="780" y="74" font-size="11" letter-spacing="2" text-anchor="middle">MAY 2026</text>
    <text fill="var(--bone)" class="mono" x="780" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Campuslands Internship</text>
  </g>

  <g class="m m6">
    <circle class="ring" cx="950" cy="125" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="pulse" cx="950" cy="125" r="4.5" fill="var(--accent)"/>
    <line x1="950" y1="129" x2="950" y2="154" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="950" y="172" font-size="11" letter-spacing="2" text-anchor="middle">JUL 2026</text>
    <text fill="var(--bone)" class="mono" x="950" y="188" font-size="10.5" letter-spacing="1" text-anchor="middle">Full Service Team</text>
  </g>

  <g class="m m7">
    <circle cx="1120" cy="125" r="4" fill="var(--bone)"/>
    <line x1="1120" y1="121" x2="1120" y2="96" stroke="var(--rule)"/>
    <text fill="var(--accent)" class="mono" x="1120" y="74" font-size="11" letter-spacing="2" text-anchor="middle">DEC 2026</text>
    <text fill="var(--bone)" class="mono" x="1120" y="90" font-size="10.5" letter-spacing="1" text-anchor="middle">Graduation</text>
  </g>
</svg>