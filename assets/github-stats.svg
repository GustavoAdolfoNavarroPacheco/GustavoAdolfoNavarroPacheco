<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" role="img" aria-label="Estadísticas de GitHub y lenguajes por repositorio"><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t64{font-size:64px;letter-spacing:-1px}.t32{font-size:32px;letter-spacing:-.3px}.t20{font-size:20px}.t16{font-size:16px}.t14{font-size:14px}.b{font-weight:600}.i{font-style:italic}.ink{fill:#141413}.tx{fill:#2b2a27}.mu{fill:#5e5d59}.so{fill:#87867f}.ac{fill:#d97757}.at{fill:#b9532f}.ul{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#a3a095}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}.pop{animation:pop .7s cubic-bezier(.2,.7,.2,1) backwards}.fade{animation:fade .9s ease backwards}.draw{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.6,0,.2,1) backwards}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes grow{from{transform:scaleX(0)}}.pulse{animation:pulse 2.8s ease-in-out infinite}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}.glint{stroke-dasharray:60 1000;animation:glint 8s ease-in-out infinite}.march{stroke-dasharray:3 7;animation:march 1.8s linear infinite}.travel{animation:travel 7s linear infinite}.nudge{animation:nudge 3.2s ease-in-out infinite}.scan{animation:scan 9s steps(1,end) infinite}.slide{animation:slide 9s linear infinite}.trace{animation:trace 10s linear infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.8);opacity:0}}@keyframes glint{0%{stroke-dashoffset:60}65%,100%{stroke-dashoffset:-1000}}@keyframes march{to{stroke-dashoffset:-10}}@keyframes travel{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}@keyframes nudge{0%,55%,100%{transform:translate(0,0)}70%{transform:translate(2px,-2px)}85%{transform:translate(0,0)}}@keyframes scan{0%{opacity:1}11.1%,100%{opacity:0}}@keyframes slide{0%{transform:translateX(0);opacity:0}6%{opacity:1}72%{opacity:1}80%,100%{transform:translateX(var(--d));opacity:0}}@keyframes trace{0%{offset-distance:0%;opacity:0}5%{opacity:1}68%{offset-distance:100%;opacity:1}75%,100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion:reduce){.rise,.pop,.fade,.draw,.grow,.pulse,.ping,.glint,.march,.travel,.nudge,.scan,.slide,.trace{animation:none}.glint,.ping,.travel,.scan,.slide,.trace{opacity:0}}</style><rect width="1000" height="312" fill="#faf9f5"/><line class="draw" pathLength="1" x1="500.5" y1="24" x2="500.5" y2="296" stroke="#a3a095" stroke-width="1" stroke-opacity="0.45" style="animation-delay:0.2s"/><text x="48" y="44" class="serif t20 ink rise">Estadísticas de GitHub</text><text x="532" y="44" class="serif t20 ink rise" style="animation-delay:0.1s">Lenguajes por repositorio</text><text x="48" y="96" class="sans t14 tx rise" style="animation-delay:0.1s">Estrellas totales</text><text x="452" y="97" class="serif t20 ink rise" text-anchor="end" style="animation-delay:0.15s">30</text><line class="draw" pathLength="1" x1="48" y1="110.5" x2="452" y2="110.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.45" style="animation-delay:0.2s"/><text x="48" y="142" class="sans t14 tx rise" style="animation-delay:0.18s">Commits en 2026</text><text x="452" y="143" class="serif t20 ink rise" text-anchor="end" style="animation-delay:0.22999999999999998s">678</text><line class="draw" pathLength="1" x1="48" y1="156.5" x2="452" y2="156.5" stroke="#a3a095" stroke-width="1" stroke-opacity="0.45" style="animation-delay:0.28s"/><text x="48" y="188" class="sans t14 tx rise" style="animation-delay:0.26s">Pull requests tota