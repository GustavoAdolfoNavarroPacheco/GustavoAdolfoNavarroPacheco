<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Sobre Gustavo: Full Stack Developer graduado de Campuslands, abierto a pasantías, freelance y colaboración"><style>.serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.t64{font-size:64px;letter-spacing:-1px}.t32{font-size:32px;letter-spacing:-.3px}.t20{font-size:20px}.t16{font-size:16px}.t14{font-size:14px}.b{font-weight:600}.i{font-style:italic}.ink{fill:#141413}.tx{fill:#2b2a27}.mu{fill:#5e5d59}.so{fill:#87867f}.ac{fill:#d97757}.at{fill:#b9532f}.ul{text-decoration:underline;text-underline-offset:3px;text-decoration-color:#a3a095}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) backwards}.pop{animation:pop .7s cubic-bezier(.2,.7,.2,1) backwards}.fade{animation:fade .9s ease backwards}.draw{stroke-dasharray:1;animation:draw 1.3s cubic-bezier(.6,0,.2,1) backwards}.grow{transform-box:fill-box;transform-origin:left center;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) backwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}}@keyframes pop{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}@keyframes draw{from{stroke-dashoffset:1}}@keyframes grow{from{transform:scaleX(0)}}.pulse{animation:pulse 2.8s ease-in-out infinite}.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}.glint{stroke-dasharray:60 1000;animation:glint 8s ease-in-out infinite}.march{stroke-dasharray:3 7;animation:march 1.8s linear infinite}.travel{animation:travel 7s linear infinite}.nudge{animation:nudge 3.2s ease-in-out infinite}.scan{animation:scan 9s steps(1,end) infinite}.slide{animation:slide 9s linear infinite}.trace{animation:trace 10s linear infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}@keyframes ping{0%{transform:scale(.5);opacity:.8}80%,100%{transform:scale(2.8);opacity:0}}@keyframes glint{0%{stroke-dashoffset:60}65%,100%{stroke-dashoffset:-1000}}@keyframes march{to{stroke-dashoffset:-10}}@keyframes travel{0%{transform:translateY(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateY(var(--d));opacity:0}}@keyframes nudge{0%,55%,100%{transform:translate(0,0)}70%{transform:translate(2px,-2px)}85%{transform:translate(0,0)}}@keyframes scan{0%{opacity:1}11.1%,100%{opacity:0}}@keyframes slide{0%{transform:translateX(0);opacity:0}6%{opacity:1}72%{opacity:1}80%,100%{transform:translateX(var(--d));opacity:0}}@keyframes trace{0%{offset-distance:0%;opacity:0}5%{opacity:1}68%{offset-distance:100%;opacity:1}75%,100%{offset-distance:100%;opacity:0}}@media (prefers-reduced-motion:reduce){.rise,.pop,.fade,.draw,.grow,.pulse,.ping,.glint,.march,.travel,.nudge,.scan,.slide,.trace{animation:none}.glint,.ping,.travel,.scan,.slide,.trace{opacity:0}}</style><rect width="1000" height="260" fill="#faf9f5"/><text x="48" y="52" class="serif t20 mu rise" style="animation-delay:0.05s">Graduated from Campuslands S.A.S</text><text x="47" y="100" class="serif t32 ink rise" style="animation-delay:0.15s">Full Stack Developer</text><text x="48" y="134" class="sans t16 tx rise" style="animation-delay:0.25s">Java · React · SpringBoot · Node.js · HTML &amp; CSS</text><text x="48" y="184" class="serif t20 mu rise" style="animation-delay:0.35s">Drawn to projects where design meets data.</text><text x="48" y="212" class="serif t20 mu rise" style="animation-delay:0.45s">Clean architecture and user experience in equal measure.</text><line class="draw" pathLength="1" x1="576.5" y1="32" x2="576.5" y2="232" stroke="#a3a095" stroke-width="1" stroke-opacity="0.6" style="animation-delay:0.3s"/><text x="600" y="52" class="sans t14 mu rise" style="animation-delay:0.3s">Enfoque</text><text x="600" y="82" class="sans t16 ink rise" style="animation-delay:0.35s">Mobile · Full-Stack Systems</text><text x="600" y="106" class="sans t16 ink rise" style="animation-delay:0.4s">Terminal UI / CLI</text><text x="600" y="130" class="sans t16 ink ri